<text x="16" y="30" font-size="16" font-weight="600" fill="#ffffff">Two questions. One method answers the first; nothing answers the second.</text>
<text x="16" y="51" font-size="12" fill="#c3c2b7">Curated allosteric annotations. Both panels remove the confound that dominates the raw numbers &#8212; proximity on the left,</text>
<text x="16" y="67" font-size="12" fill="#c3c2b7">structure size on the right &#8212; by comparing only matched pairs. Bars are drawn from chance.</text>
<text x="16" y="105" font-size="11.5" fill="#d95926">Right panel caveat: ctrl_dist still reaches 0.752, so matching on residue count does not remove every difference between the two sets.</text>
